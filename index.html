<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex,nofollow,noarchive,noimageindex"><meta name="googlebot" content="noindex,nofollow,noarchive,noimageindex"><meta name="theme-color" content="#f44837"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>あそびランド</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><button id="back" class="small hidden">← もどる</button><strong id="title">あそびランド</strong><div class="head-right"><button id="reset" class="small hidden">↻ やりなおし</button><button id="hint" class="small hidden">💡 ヒント</button><button id="lock" class="small hidden" aria-label="保護者モード（3秒長押し）">🔒</button></div></header><main><section id="home" class="screen"><div class="hero"><div class="sun">☀️</div><h1>あそびランド</h1><p>すきな あそびを えらんでね！</p><button class="game-tile" id="start">🧩<span>パズル</span></button></div></section><section id="gallery" class="screen hidden"><h2>どの えで あそぶ？</h2><div id="tiles" class="tiles"></div><p id="empty" class="empty hidden">まだ パズルが ないよ。<br>おうちのひとに いれてもらってね！</p><p class="helper">🔒 を3びょう おすと がぞうを ついかできるよ</p></section><section id="difficulty" class="screen hidden"><div class="difficulty-wrap"><h2>むずかしさを えらんでね！</h2><div class="difficulty-options"><button class="difficulty-btn" data-size="2">🌼<span>かんたん</span><small>4ピース</small></button><button class="difficulty-btn" data-size="3">⭐<span>ふつう</span><small>9ピース</small></button><button class="difficulty-btn" data-size="4">🔥<span>むずかしい</span><small>16ピース</small></button></div></div></section><section id="game" class="screen hidden"><div class="play-layout"><div class="reference"><div class="tag">おてほん</div><img id="referenceImg" alt="完成見本"></div><div class="game-area"><div class="tag">ここに はめてね！</div><div id="board" class="board"><div id="ghost"></div><div id="cells"></div></div><div id="tray" class="tray"></div></div></div></section><section id="parent" class="screen hidden"><h2>おうちのひと の がめん</h2><p>iPadの写真から画像を追加できます。画像はこの端末のブラウザ内に保存されます。</p><label class="add-btn" for="file">＋ がぞうを ついか</label><input id="file" type="file" accept="image/*" hidden><div id="manage" class="tiles"></div></section></main><div id="cropModal" class="overlay hidden"><div class="dialog"><h2>しゃしんを きりぬく</h2><p>指で動かす・2本指で拡大縮小できます</p><canvas id="cropCanvas" width="420" height="420"></canvas><div class="crop-controls"><label>おおきさ <input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label></div><div class="actions"><button id="cropCancel">やめる</button><button id="cropSave" class="primary">ほぞん</button></div></div></div><div id="complete" class="overlay hidden"><div id="confetti"></div><div class="dialog done"><h1>🎉 できた！ 🎉</h1><img id="doneImg" alt="完成したパズル"><div class="actions"><button id="again" class="primary">🔁 もういっかい</button><button id="next" class="primary">🖼️ つぎへ</button></div></div></div><div id="dragPiece" class="drag-piece hidden"></div></div><script src="app.js"></script></body></html>
