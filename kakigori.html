</style><header><a href="./index.html">← あそびランド</a><h1>🍧 カラフルかきごおり</h1><button onclick="clearSlots()">↻</button></header><main class="wrap"><div class="stage"><svg viewBox="0 0 360 340"><rect x="8" y="5" width="344" height="330" rx="30" fill="#ffffff7d"/><g opacity=".65"><text x="30" y="50" font-size="32">🧪</text><text x="295" y="50" font-size="32">✨</text></g><path d="M80 212 Q68 140 117 101 Q154 73 180 70 Q230 65 263 111 Q296 154 280 212Z" fill="#fff" stroke="#b9d8e4" stroke-width="6"/><defs><clipPath id="iceClip"><path d="M80 212 Q68 140 117 101 Q154 73 180 70 Q230 65 263 111 Q296 154 280 212Z"/></clipPath></defs><g clip-path="url(#iceClip)"><path d="M80 212 Q68 140 117 101 Q154 73 180 70 Q230 65 263 111 Q296 154 280 212Z" fill="#ffffff"/><path id="icecolor" d="M105 112 Q153 85 181 78 Q234 80 252 126 L263 183 Q240 162 222 191 Q204 175 189 199 Q172 177 153 202 Q132 177 113 193 Q98 179 84 196 L86 147Z" fill="#ffffff" opacity=".88"/><g fill="#fff" opacity=".85"><circle cx="118" cy="147" r="6"/><circle cx="174" cy="115" r="8"/><circle cx="230" cy="149" r="6"/><circle cx="202" cy="176" r="5"/><circle cx="137" cy="183" r="5"/></g></g><path d="M65 213 L295 213 L260 294 Q180 320 100 294Z" fill="#a1d9f4a8" stroke="#83b5cb" stroke-width="5"/><path d="M77 227L283 227" stroke="#fff" stroke-width="7"/><text x="180" y="320" text-anchor="middle" font-size="17" fill="#755065">ふたつの いろを まぜよう！</text></svg></div><section class="controls"><div class="modes"><button id="paint" class="on" onclick="mode='paint';render()">🎨 ふつうのシロップ</button><button id="light" onclick="mode='light';render()">✨ ピカピカシロップ</button></div><div class="slots"><div class="slot" data-slot="0">①</div><div class="slot" data-slot="1">②</div></div><div class="result" id="result">いろの まるを うえに ドラッグ！</div><div class="palette" id="palette"></div><p class="help">2色の丸を空白の丸へ運んでね。タップしてから空欄をタップしてもOK。</p></section></main><script>
const colors=[['しろ','#fff8ec'],['きいろ','#ffe03b'],['だいだい','#f99732'],['あか','#ed3e43'],['ももいろ','#f7a0bd'],['むらさき','#9c6dcb'],['あお','#397ddd'],['みずいろ','#7dd5ec'],['みどり','#51b45b'],['きみどり','#a8ce57'],['ちゃいろ','#91613e'],['くろ','#35343a'],['おうど','#bc9a53'],['しゅいろ','#e96037'],['うすだいだい','#f5c393'],['こげちゃ','#66402d'],['ねずみ','#9a9a9a'],['ふかみどり','#267a56'],['ぐんじょう','#3b4ca7'],['あいいろ','#324e7b'],['あかむらさき','#bb468e'],['うすむらさき','#cfb3e7'],['きんいろ','#e5bd3e'],['ぎんいろ','#c4cbd1']];let mode='paint',slots=[null,null],selected=null;const $=id=>document.getElementById(id);function speak(s){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}catch{}}function rgb(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255)}function mix(a,b){let A=rgb(a),B=rgb(b);let c=A.map((v,i)=>{let q=mode==='light'?Math.min(1,v+B[i]):Math.sqrt(v*B[i]);return Math.round(q*255)});return '#'+c.map(x=>x.toString(16).padStart(2,'0')).join('')}function render(){['paint','light'].forEach(k=>$(k).classList.toggle('on',k===mode));document.querySelectorAll('.slot').forEach((e,i)=>{e.style.background=slots[i]===null?'white':colors[slots[i]][1];e.textContent=slots[i]===null?i+1:'';e.classList.toggle('filled',slots[i]!==null)});let result=slots.every(x=>x!==null);let hex=result?mix(colors[slots[0]][1],colors[slots[1]][1]):'#ffffff';$('icecolor').setAttribute('fill',hex);$('result').textContent=result?colors[slots[0]][0]+' ＋ '+colors[slots[1]][0]+' → '+(colors.find(x=>x[1].toLowerCase()===hex)?.[0]||'まざった いろ'):'いろを 2つ えらんでね';if(result)speak($('result').textContent)}function setSlot(i,n){slots[i]=n;selected=null;render()}document.querySelectorAll('.slot').forEach(e=>e.onclick=()=>{if(selected!==null)setSlot(+e.dataset.slot,selected)});colors.forEach((c,i)=>{let b=document.createElement('button');b.className='dot';b.style.background=c[1];b.title=c[0];b.setAttribute('aria-label',c[0]);b.onclick=()=>{selected=i;speak(c[0])};b.onpointerdown=e=>{e.preventDefault();if(e.pointerType==='mouse')return;selected=i;let ghost=document.createElement('div');ghost.className='ghost';ghost.style.background=c[1];document.body.append(ghost);const move=ev=>{ghost.style.left=ev.clientX-22+'px';ghost.style.top=ev.clientY-22+'px'};move(e);b.setPointerCapture(e.pointerId);b.onpointermove=move;b.onpointerup=ev=>{let target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.slot');if(target)setSlot(+target.dataset.slot,i);ghost.remove();b.onpointermove=null;b.onpointerup=null}};$('palette').append(b)});function clearSlots(){slots=[null,null];render()}render();
