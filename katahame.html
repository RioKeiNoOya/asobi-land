<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かたはめパズル | あそびランド</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#e8f8ff;color:#214963}header{display:flex;align-items:center;justify-content:space-between;background:#9bd9ee;padding:8px 12px;gap:6px}h1{font-size:20px;margin:0}button,select,input{font:inherit}button{border:0;border-radius:13px;background:#fff0c1;padding:9px 12px;font-weight:bold;cursor:pointer}a{color:inherit;text-decoration:none;font-weight:bold}.tools{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px;flex-wrap:wrap}.board{position:relative;margin:auto;width:min(96vw,850px);height:min(60dvh,500px);border-radius:22px;overflow:hidden;background:linear-gradient(#74d9f4 0%,#a6eff5 55%,#f6dfa2 80%,#f8e6bb);box-shadow:0 4px 10px #abc}.board.market{background:linear-gradient(#f9e5b7 0 16%,#fffaee 16% 70%,#d5b98e 70%);}.shelf{position:absolute;left:0;right:0;top:62%;height:9px;background:#b98e5c;display:none}.market .shelf{display:block}.hole{position:absolute;display:grid;place-items:center;border:3px dashed #ffffffdf;background:#ffffff61;filter:drop-shadow(0 2px 1px #5487a2);border-radius:23%;width:15%;height:23%;font-size:clamp(22px,5vw,56px);color:transparent;user-select:none}.hole.simple{border-radius:50%;clip-path:circle(49%)}.hole.done{background:#ffffff00;border-color:transparent;color:inherit;filter:none}.hole.hint{outline:5px solid #ffcf2d}.tray{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px;min-height:110px;flex-wrap:wrap}.piece{font-size:clamp(26px,5vw,50px);min-width:70px;min-height:70px;background:#fff;border:3px solid #f2b6a4;touch-action:none;user-select:none;position:relative}.piece.dragging{opacity:.4}.ghost{position:fixed;z-index:30;pointer-events:none;font-size:52px}.note{text-align:center;font-size:13px;margin:4px}.parent{margin:8px auto;max-width:700px;background:white;border-radius:16px;padding:10px}.parent summary{cursor:pointer;font-weight:bold}.parent input{max-width:100%}@media(max-width:600px){.board{height:47dvh}.hole{width:20%;height:22%}.piece{min-width:55px;min-height:55px}h1{font-size:16px}}</style><header><a href="./index.html">← あそびランド</a><h1>🐠 かたはめパズル</h1><button onclick="start()">↻ もういっかい</button></header><div class="tools"><select id="scene" onchange="start()"><option value="sea">🌊 うみ</option><option value="market">🛒 スーパー</option></select><select id="difficulty" onchange="start()"><option value="3">🌼 かんたん・3こ</option><option value="4">⭐ ふつう・4こ</option><option value="6">🔥 むずかしい・6こ</option></select><button onclick="hint()">💡 ヒント</button></div><div id="board" class="board"><div class="shelf"></div></div><div id="tray" class="tray"></div><p id="message" class="note">おなじ かたちに はめてね！</p><details class="parent"><summary>🔒 おうちのひと：カスタム画像の登録・削除</summary><p class="note">背景が透明なPNGがおすすめ。名前を入れると読み上げます。画像は端末内に保存します。</p><input type="file" id="files" accept="image/*" multiple><input id="customName" placeholder="名前（例：アンパンマン）"><select id="category"><option value="sea0">海：水中</option><option value="sea1">海：海底</option><option value="sea2">海：砂浜</option><option value="market0">スーパー：野菜</option><option value="market1">スーパー：果物</option><option value="market2">スーパー：お客さん</option></select><button onclick="addCustom()">＋ とうろく</button><div id="manage"></div></details><script>
const sea=[[['クジラ','🐋'],['イルカ','🐬'],['マグロ','🐟'],['タイ','🐠'],['クラゲ','🪼'],['クマノミ','🐠']],[['タコ','🐙'],['ヒトデ','⭐'],['海藻','🌿'],['貝','🐚']],[['カニ','🦀'],['カメ','🐢'],['ヤドカリ','🐚']]];const market=[[['にんじん','🥕'],['だいこん','🥬'],['ほうれんそう','🥬'],['たまねぎ','🧅'],['じゃがいも','🥔'],['さつまいも','🍠']],[['りんご','🍎'],['みかん','🍊'],['ぶどう','🍇'],['いちご','🍓'],['もも','🍑'],['すいか','🍉'],['パイナップル','🍍'],['バナナ','🍌'],['さくらんぼ','🍒']],[['おきゃくさん','🛒'],['おかいもの','🧍'],['カードでおかいもの','💳']]];let custom=[];try{custom=JSON.parse(localStorage.getItem('asobi_shape_custom')||'[]')}catch{};let active=[],done=new Set(),positions=[];const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;speechSynthesis.speak(u)}catch{}}function beep(f=520){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.04,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.15);o.start();o.stop(c.currentTime+.16)}catch{}}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function itemNode(item){return item.src?`<img src="${item.src}" style="width:80%;height:80%;object-fit:contain;pointer-events:none">`:item.emoji}function start(){let sc=$('scene').value,level=+$('difficulty').value;let base=sc==='sea'?sea:market;let pool=base.map((group,i)=>shuffle(group.map(([name,emoji])=>({name,emoji,cat:i})).concat(custom.filter(x=>x.scene===sc&&x.cat===i))));let picks=[];for(let i=0;i<3;i++)if(pool[i].length)picks.push(pool[i].shift());if(level===4){let candidates=shuffle(pool.flat());if(candidates.length)picks.push(candidates[0])}if(level===6){for(let i=0;i<3;i++)if(pool[i].length)picks.push(pool[i].shift())}active=shuffle(picks);done=new Set();$('board').className='board '+(sc==='market'?'market':'');$('board').innerHTML='<div class="shelf"></div>';$('tray').innerHTML='';positions=[];active.forEach((item,i)=>{let zone=item.cat;let x=sc==='sea'?[13,43,72][zone]:[13,43,72][zone],y=sc==='sea'?[15,51,73][zone]:[34,34,69][zone];let count=positions.filter(p=>p.cat===zone).length;x+=count?15:0;y+=count?-12:0;positions.push({cat:zone,x,y});let h=document.createElement('div');h.className='hole'+(level===3?' simple':'');h.style.left=x+'%';h.style.top=y+'%';h.dataset.idx=i;h.innerHTML=itemNode(item);$('board').append(h);let b=document.createElement('button');b.className='piece';b.innerHTML=itemNode(item);b.setAttribute('aria-label',item.name);b.onpointerdown=e=>dragStart(e,b,i);$('tray').append(b)});$('message').textContent='おなじ かたちに はめてね！'}function dragStart(e,b,i){if(done.has(i))return;e.preventDefault();beep(390);speak(active[i].name);b.setPointerCapture(e.pointerId);let g=document.createElement('div');g.className='ghost';g.innerHTML=itemNode(active[i]);document.body.append(g);g.querySelector('img')?.setAttribute('style','width:65px;height:65px;object-fit:contain');const move=ev=>{g.style.left=ev.clientX-28+'px';g.style.top=ev.clientY-35+'px'};move(e);b.classList.add('dragging');b.onpointermove=move;b.onpointerup=ev=>{g.remove();b.classList.remove('dragging');b.onpointermove=null;b.onpointerup=null;let hole=$('board').querySelector(`.hole[data-idx="${i}"]`),r=hole.getBoundingClientRect();let cx=r.left+r.width/2,cy=r.top+r.height/2;if(Math.hypot(ev.clientX-cx,ev.clientY-cy)<Math.max(70,r.width*.85)){done.add(i);hole.classList.add('done');b.style.visibility='hidden';beep(740);setTimeout(()=>speak(active[i].name),190);if(done.size===active.length){$('message').textContent='🎉 ぜんぶ できた！ 🎉';setTimeout(()=>beep(950),300)}}};b.onpointercancel=()=>{g.remove();b.classList.remove('dragging')}}function hint(){let h=$('board').querySelector('.hole:not(.done)');if(h){h.classList.add('hint');setTimeout(()=>h.classList.remove('hint'),1300)}}function addCustom(){let fs=Array.from($('files').files),name=$('customName').value.trim(),c=$('category').value;if(!fs.length||!name){alert('画像と名前を入れてね');return}let scene=c.startsWith('sea')?'sea':'market',cat=+c.slice(-1);let jobs=fs.map(f=>new Promise(res=>{let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let can=document.createElement('canvas');let k=Math.min(1,300/Math.max(im.width,im.height));can.width=Math.round(im.width*k);can.height=Math.round(im.height*k);can.getContext('2d').drawImage(im,0,0,can.width,can.height);custom.push({name,src:can.toDataURL('image/png'),scene,cat});res()};im.src=reader.result};reader.readAsDataURL(f)}));Promise.all(jobs).then(()=>{try{localStorage.setItem('asobi_shape_custom',JSON.stringify(custom))}catch{alert('保存容量が足りない可能性があります')}manage();start()})}function manage(){$('manage').innerHTML='';custom.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c.name+' ×';b.onclick=()=>{if(confirm(c.name+'を削除する？')){custom.splice(i,1);localStorage.setItem('asobi_shape_custom',JSON.stringify(custom));manage();start()}};$('manage').append(b)})}manage();start();
</script></html>
