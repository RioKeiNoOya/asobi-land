<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ソフトクリーム屋さん | あそびランド</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff3dc;color:#633d2a;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif}header{padding:10px 16px;background:#ffdc9e;display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(16px,3vw,25px);margin:0}.layout{display:grid;grid-template-columns:43% 57%;height:calc(100dvh - 58px);min-height:430px}.preview{background:linear-gradient(#fff9ec,#ffe7bb);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.menu{padding:12px;overflow:auto;background:#fffdf8;border-left:4px solid #f5d4a1}.steps{display:flex;gap:5px;overflow:auto;padding-bottom:8px}.steps button{white-space:nowrap;padding:9px 11px;border-radius:18px;background:#f4e8d6}.steps button.active{background:#f69b54;color:white}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.choice{border:3px solid transparent;border-radius:16px;min-height:90px;background:#fff0d6;padding:7px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;box-shadow:0 3px 0 #e9cda8}.choice.selected{border-color:#e76d49}.emoji{font-size:36px;line-height:1.2}.choice svg{height:62px;width:65px}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}button{cursor:pointer;border:0;font-family:inherit;font-weight:bold;color:inherit}button.primary{background:#f17f55;color:white;padding:13px 20px;border-radius:24px;font-size:17px}.secondary{background:#eee0c6;padding:12px;border-radius:22px}.preview svg{width:100%;height:100%;max-height:570px}.toast{position:absolute;bottom:8px;left:8px;right:8px;text-align:center;font-weight:bold;font-size:13px}.tiny{font-size:12px;opacity:.8}.heading{font-size:20px;margin:8px 0 14px}input[type=file]{max-width:100%}#customArea{display:none;margin-top:12px;padding:10px;background:#fff0dc;border-radius:12px}.decor{position:absolute;touch-action:none;cursor:grab;font-size:32px;user-select:none;filter:drop-shadow(0 2px 1px #8a6a5a)}.decor img{width:52px;height:52px;object-fit:contain}.small{font-size:12px} @media(max-width:550px){.layout{grid-template-columns:42% 58%}.menu{padding:7px}.choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.choice{min-height:83px;font-size:12px}.emoji{font-size:31px}.steps button{padding:7px;font-size:12px}.heading{font-size:16px}.decor{font-size:25px}}
</style>
<header><a href="./index.html" style="color:#633d2a;text-decoration:none;font-weight:bold">← あそびランド</a><h1>🍦 ちいさなソフトクリームやさん</h1><button class="secondary" onclick="reset()">はじめから</button></header>
<main class="layout"><section class="preview" id="preview"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 430" aria-label="ソフトクリームのプレビュー">
<ellipse cx="125" cy="401" rx="79" ry="13" fill="#d9c6aa"/><rect x="93" y="369" width="64" height="17" rx="7" fill="#aab9c1"/><rect x="119" y="334" width="12" height="40" fill="#aab9c1"/><ellipse cx="125" cy="332" rx="53" ry="12" fill="#8fa3af"/>
<g id="cone"></g><g id="ice"></g><g id="sauce"></g><g id="sprinkle"></g></svg><div id="decorLayer" style="position:absolute;inset:0;pointer-events:none"></div><div class="toast" id="toast">すきなものを えらんでね！</div></section>
<section class="menu"><nav class="steps" id="steps"></nav><h2 class="heading" id="heading"></h2><div class="choices" id="choices"></div><div id="customArea"><label>かざりの しゃしんを とうろく <input type="file" accept="image/*" id="upload"></label><div class="tiny">とうろくした画像はこの端末のブラウザに保存します。</div></div><div class="actions"><button class="secondary" onclick="back()">◀ まえ</button><button class="primary" onclick="next()">つぎへ ▶</button><button class="secondary" onclick="save()">📷 ほぞん</button></div><p class="tiny" id="note"></p></section></main>
<script>
const steps=['コーン','まきかた','あじ','ソース','かざり'];let step=0, savedSignature='',decors=[],serial=0;
const cones=[['ふつう','🍦','#d4a36d'],['ワッフル','🧇','#c98d49'],['チョコ','🍫','#78432c'],['フラワー','🌼','#e3b77c'],['シュガー','🔻','#d5a067'],['ワッフルカップ','🥣','#d7a46b']];
const shapes=[['まるまる','☁️'],['ぐるぐる','🍦'],['ほそほそ','🧵']];
const flavors=[['バニラ','🌼','#fff0d2'],['いちご','🍓','#f5a0bc'],['ラズベリー','🍓','#e93649'],['まっちゃ','🍵','#91ba72'],['チョコ','🍫','#8d5c40'],['ラムネ','🧴','#85d8f2'],['みかん','🍊','#f7a13d'],['ラベンダー','🪻','#bba3dd'],['レモン','🍋','#f4e34f']];
const sauces=[['なし','🚫'],['チョコ','🍫'],['いちご','🍓'],['ホワイト','🥛'],['カラースプレー','🌈']];
const decorations=[['いちご','🍓'],['さくらんぼ','🍒'],['バナナ','🍌'],['クッキー','🍪'],['ウェハース','🧇'],['チョコスティック','🍫'],['ほし','⭐'],['ハート','❤️'],['リボン','🎀'],['おたんじょうび','🎉']];
let state={cone:0,shape:1,flavor:0,sauce:0,sprinkles:false};
let customs=[];try{customs=JSON.parse(localStorage.getItem('soft_customs')||'[]')}catch{}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}catch{}}
function beep(freq=500){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=freq;g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);o.start();o.stop(a.currentTime+.14)}catch{}}
function choose(i){beep();if(step===0){state.cone=i;speak(cones[i][0]+'コーン')}if(step===1){state.shape=i;speak(shapes[i][0])}if(step===2){state.flavor=i;speak(flavors[i][0])}if(step===3){if(i===4){state.sprinkles=!state.sprinkles}else{state.sauce=i} speak(sauces[i][0])}if(step===4){let items=decorations.concat(customs.map(c=>[c.name,'🖼️',c.data]));if(decors.length>=10){document.getElementById('toast').textContent='かざりは 10こまで！';return}let item=items[i];decors.push({id:++serial,label:item[0],emoji:item[1],src:item[2]||'',x:50+(decors.length%3-1)*13,y:27+Math.floor(decors.length/3)*9});speak(item[0]);}render()}
function coneSvg(){let c=cones[state.cone][2];if(state.cone===5)return `<path d="M70 251 L180 251 L164 316 Q125 339 86 316Z" fill="${c}" stroke="#a56d37" stroke-width="4"/>`;return `<path d="M72 248 L178 248 L125 335 Z" fill="${c}" stroke="#a56d37" stroke-width="4"/><path d="M87 263L148 302M105 256L136 318M160 262L101 306M143 253L111 316" stroke="#aa7846" stroke-width="2" opacity=".6"/>`}
function iceSvg(){let c=flavors[state.flavor][2];if(state.shape===0)return `<g fill="${c}" stroke="#fff9" stroke-width="2"><ellipse cx="125" cy="239" rx="58" ry="22"/><ellipse cx="125" cy="209" rx="49" ry="25"/><ellipse cx="125" cy="176" rx="39" ry="25"/><ellipse cx="125" cy="145" rx="27" ry="22"/><circle cx="125" cy="124" r="13"/></g>`;if(state.shape===2){let s='';for(let i=0;i<17;i++){let x=82+i*5.4;s+=`<path d="M${x} 249 Q${x-25} 210 ${x+9} 187 Q${x-14} 167 ${x+9} 146 Q${x-5} 127 125 112" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/>`;}return s}return `<path d="M68 247 Q54 227 77 213 Q64 196 91 185 Q76 169 102 157 Q91 143 113 132 Q111 118 125 108 Q138 120 138 131 Q163 145 149 157 Q175 170 159 185 Q185 201 171 214 Q196 232 180 247Z" fill="${c}" stroke="#ffffff80" stroke-width="3"/><path d="M76 222Q126 241 174 222M87 190Q126 210 164 190M101 159Q126 176 150 159M115 133Q126 141 136 133" fill="none" stroke="#ffffff90" stroke-width="8"/>`}
function sauceSvg(){let s=state.sauce;if(!s)return '';let c=['','#6e3428','#e85b7b','#fffdf0'][s];return `<path d="M101 155 Q115 141 125 145 Q141 136 150 158 Q162 171 151 179 L148 199 Q144 204 141 197 L138 178 Q124 187 116 176 L110 198 Q106 205 102 196Z" fill="${c}" stroke="#ffffff55" stroke-width="2"/>`}
function sprinklesSvg(){if(!state.sprinkles)return '';let s='';for(let i=0;i<24;i++){let x=83+(i*37)%86,y=163+(i*29)%78;s+=`<rect x="${x}" y="${y}" width="9" height="3" rx="1" transform="rotate(${i*31} ${x} ${y})" fill="${['#ff5786','#3e9de0','#f1c22b','#72b45b'][i%4]}"/>`}return s}
function render(){document.getElementById('cone').innerHTML=coneSvg();document.getElementById('ice').innerHTML=iceSvg();document.getElementById('sauce').innerHTML=sauceSvg();document.getElementById('sprinkle').innerHTML=sprinklesSvg();document.getElementById('steps').innerHTML=steps.map((s,i)=>`<button class="${step===i?'active':''}" onclick="step=${i};render()">${i+1}. ${s}</button>`).join('');document.getElementById('heading').textContent=['コーンを えらぼう','まきかたを えらぼう','あじを えらぼう','ソースを かけよう','すきな かざりを のせよう'][step];let opts=[cones,shapes,flavors,sauces,decorations.concat(customs.map(c=>[c.name,'🖼️',c.data]))][step];document.getElementById('choices').innerHTML=opts.map((o,i)=>{let sel=(step===0&&state.cone===i)||(step===1&&state.shape===i)||(step===2&&state.flavor===i)||(step===3&&(i===4?state.sprinkles:state.sauce===i));let bg=step===2?o[2]:'#fff0d6';return `<button class="choice ${sel?'selected':''}" style="background:${bg}" onclick="choose(${i})">${o[2]&&step===4?`<img src="${o[2]}" style="width:52px;height:52px;object-fit:contain">`:`<span class="emoji">${o[1]}</span>`}<span>${o[0]}</span></button>`}).join('');document.getElementById('customArea').style.display=step===4?'block':'none';document.getElementById('note').textContent=step===4?'かざりは10こまで。かざりを ゆびで うごかせるよ。':'えらぶと ひだりの アイスが かわるよ。';let layer=document.getElementById('decorLayer');layer.innerHTML='';decors.forEach(d=>{let el=document.createElement('div');el.className='decor';el.style.cssText=`left:${d.x}%;top:${d.y}%;pointer-events:auto`;el.innerHTML=d.src?`<img src="${d.src}">`:d.emoji;el.title=d.label+'（ダブルタップで削除）';el.ondblclick=()=>{decors=decors.filter(x=>x.id!==d.id);render()};el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);beep(380);let r=document.getElementById('preview').getBoundingClientRect();el.onpointermove=ev=>{d.x=Math.max(2,Math.min(85,(ev.clientX-r.left)/r.width*100));d.y=Math.max(5,Math.min(85,(ev.clientY-r.top)/r.height*100));el.style.left=d.x+'%';el.style.top=d.y+'%'};el.onpointerup=()=>{el.onpointermove=null}};layer.append(el)})}
function next(){if(step<4){step++;render()}else{beep(800);speak('できあがり！');document.getElementById('toast').textContent='✨ できあがり！ ✨'}}function back(){step=Math.max(0,step-1);render()}function reset(){state={cone:0,shape:1,flavor:0,sauce:0,sprinkles:false};decors=[];step=0;render()}
document.getElementById('upload').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let name=prompt('かざりの なまえ（よみあげます）','アンパンマン');if(!name)return;customs.push({name:name.slice(0,24),data:r.result});try{localStorage.setItem('soft_customs',JSON.stringify(customs))}catch{alert('画像が大きくて保存できませんでした')}render()};r.readAsDataURL(f)};
async function save(){let sig=JSON.stringify({state,decors});if(sig===savedSignature){document.getElementById('toast').textContent='おなじ しゃしんは ほぞんずみ！';return}let svg=document.querySelector('.preview svg').cloneNode(true);let blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'});let url=URL.createObjectURL(blob),img=new Image();img.onload=async()=>{let c=document.createElement('canvas');c.width=700;c.height=1200;let ctx=c.getContext('2d');ctx.fillStyle='#fff7e7';ctx.fillRect(0,0,700,1200);ctx.drawImage(img,0,0,700,1200);let p=document.getElementById('preview').getBoundingClientRect();for(let d of decors){let x=d.x/100*700,y=d.y/100*1200;if(d.src){let im=new Image();im.src=d.src;try{await im.decode();ctx.drawImage(im,x,y,100,100)}catch{}}else{ctx.font='75px serif';ctx.fillText(d.emoji,x,y+75)}}c.toBlob(async b=>{let file=new File([b],'softcream.jpg',{type:'image/jpeg'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});document.getElementById('toast').textContent='しゃしんを ほぞんしてね'}else{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='softcream.jpg';a.click();document.getElementById('toast').textContent='しゃしんを ダウンロードしたよ'}savedSignature=sig;beep(900)}catch{document.getElementById('toast').textContent='ほぞんを やめたよ'}},'image/jpeg',.85);URL.revokeObjectURL(url)};img.src=url}
render();
</script></html>
